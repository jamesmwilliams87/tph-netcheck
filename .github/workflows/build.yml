name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  neptune-server:
    # Neptune (DS1817) has an Annapurna Labs Alpine AL314, a 32-bit ARM chip.
    # Saturn (DS923+) is x86_64, built too in case it is useful later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build static binaries
        run: |
          mkdir -p dist
          for t in armv7-unknown-linux-musleabihf x86_64-unknown-linux-musl; do
            cross build --release -p tph-netcheck-server --target $t
            cp target/$t/release/tph-netcheck-server dist/tph-netcheck-server-$t
          done
          file dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: neptune-server
          path: dist/*

  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            args: --target universal-apple-darwin
            paths: |
              app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows
            args: ""
            paths: |
              app/src-tauri/target/release/bundle/msi/*.msi
              app/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri CLI
        working-directory: app
        run: npm install
      - name: Build
        working-directory: app
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: tph-netcheck-${{ matrix.name }}
          path: ${{ matrix.paths }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, neptune-server, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
